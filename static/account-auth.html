<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>登录 · SukiSU 主题镜像</title>
<script>
(function () {
  try {
    var saved = localStorage.getItem('sukisu-admin-theme');
    var light = saved ? saved === 'light' : window.matchMedia('(prefers-color-scheme: light)').matches;
    document.documentElement.dataset.theme = light ? 'light' : 'dark';
  } catch (_) {
    document.documentElement.dataset.theme = 'dark';
  }
})();
</script>
<script src="/i18n.js"></script>
<link rel="stylesheet" href="/app.css">
</head>
<body>
<div class="login-page">
  <button class="theme-toggle" id="themeToggle" title="切换深色/浅色" aria-label="切换深色/浅色">
    <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M20.5 14.2A8.5 8.5 0 0 1 9.8 3.5 8.5 8.5 0 1 0 20.5 14.2Z"/></svg>
    <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2.2M12 19.8V22M2 12h2.2M19.8 12H22M4.9 4.9l1.6 1.6M17.5 17.5l1.6 1.6M19.1 4.9l-1.6 1.6M6.5 17.5l-1.6 1.6"/></svg>
  </button>
  <div class="lang-switch lang-switch-fixed" data-lang-switcher></div>

  <section class="login-card">
    <div class="story">
      <div class="brand">
        <div class="logo"><img src="/account/logo.svg" alt="SukiSU Ultra"></div>
        <div><h1>SukiSU 主题镜像</h1><p>Theme mirror console</p></div>
      </div>
      <h2>管理你的<br><em>主题镜像</em></h2>
      <p>使用同一个账号登录；作者可以投稿和管理主题，管理员会看到审核与管理功能。</p>
      <div class="features">
        <div class="feature">
          <i><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="8" r="3.2"/><path d="M5 20c.8-4 3.1-6 7-6s6.2 2 7 6"/></svg></i>
          <div><b>账号资料</b><span>用户名、邮箱、密码和头像</span></div>
        </div>
        <div class="feature">
          <i><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M15 7a4 4 0 1 1-3.8 5.2L4 19.4V21h2.6l1.4-1.4V18h1.6l1.2-1.2v-1.4h1.4l.8-.8A4 4 0 0 1 15 7Z"/><circle cx="16.5" cy="7.5" r="1"/></svg></i>
          <div><b>作者绑定</b><span>复用已有作者 ID，或申请新的身份</span></div>
        </div>
        <div class="feature">
          <i><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M5 5h14v14H5z"/><path d="M8 9h8M8 13h5"/></svg></i>
          <div><b>投稿记录</b><span>查看审核状态、已发布主题和撤回</span></div>
        </div>
      </div>
    </div>

    <div class="form-panel">
      <div class="form-brand"><img src="/account/logo.svg" alt="SukiSU"><div><b>SukiSU 主题镜像</b><span>统一登录</span></div></div>
      <h3>登录或注册</h3>
      <p class="lead">使用同一个账号登录；系统会根据账号权限显示对应功能。</p>
      <div class="auth-tabs" id="authTabs">
        <button type="button" data-tab="login" class="active">登录</button>
        <button type="button" data-tab="register">注册</button>
      </div>
      <div class="auth-message" id="authMessage" role="status"></div>
      <div class="login-error" id="authError" role="alert"></div>

      <form id="loginForm" class="auth-form active" autocomplete="on">
        <label for="login">用户名或邮箱</label>
        <div class="field">
          <input id="login" name="login" autocomplete="username" spellcheck="false" placeholder="用户名或邮箱" required>
        </div>
        <label for="password">密码</label>
        <div class="field">
          <input id="password" name="password" type="password" autocomplete="current-password" placeholder="输入密码" required>
          <button type="button" class="eye" id="togglePassword" title="显示/隐藏密码" aria-label="显示或隐藏密码">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M2.5 12S6 6.5 12 6.5 21.5 12 21.5 12 18 17.5 12 17.5 2.5 12 2.5 12Z"/><circle cx="12" cy="12" r="2.7"/></svg>
          </button>
        </div>
        <a class="forgot-link" href="#" id="forgotLink">忘记密码？</a>
        <button type="submit" class="login-btn" id="loginBtn"><span class="spinner"></span><span id="loginLabel">登录</span></button>
        <button type="button" class="github-btn" id="githubLogin">使用 GitHub 登录</button>
      </form>

      <form id="registerForm" class="auth-form" autocomplete="on">
        <label for="regUsername">用户名</label>
        <div class="field"><input id="regUsername" name="username" autocomplete="username" spellcheck="false" placeholder="3-32 位字母、数字或 . _ -" required></div>
        <label for="regDisplayName">显示名称</label>
        <div class="field"><input id="regDisplayName" name="displayName" autocomplete="nickname" placeholder="主题作者显示名称" required></div>
        <label for="regEmail">邮箱</label>
        <div class="field"><input id="regEmail" name="email" type="email" autocomplete="email" placeholder="用于验证和找回密码" required></div>
        <label for="regPassword">密码</label>
        <div class="field">
          <input id="regPassword" name="password" type="password" autocomplete="new-password" placeholder="至少 8 位" required>
          <button type="button" class="eye" id="toggleRegPassword" title="显示/隐藏密码" aria-label="显示或隐藏密码">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M2.5 12S6 6.5 12 6.5 21.5 12 21.5 12 18 17.5 12 17.5 2.5 12 2.5 12Z"/><circle cx="12" cy="12" r="2.7"/></svg>
          </button>
        </div>
        <label for="regConfirm">确认密码</label>
        <div class="field"><input id="regConfirm" name="confirmPassword" type="password" autocomplete="new-password" placeholder="再次输入密码" required></div>
        <button type="submit" class="login-btn" id="registerBtn"><span class="spinner"></span><span id="registerLabel">注册账号</span></button>
        <button type="button" class="github-btn" id="githubRegister">使用 GitHub 注册</button>
      </form>

      <form id="forgotForm" class="auth-form" autocomplete="on">
        <label for="forgotEmail">邮箱或账号名称</label>
        <div class="field"><input id="forgotEmail" name="login" type="text" autocomplete="username" placeholder="注册邮箱或账号名称" required></div>
        <button type="submit" class="login-btn" id="forgotBtn"><span class="spinner"></span><span id="forgotLabel">发送重置邮件</span></button>
        <div class="auth-alt"><a href="#" id="backToLogin">返回登录</a></div>
      </form>

      <form id="resetForm" class="auth-form" autocomplete="on">
        <label for="resetPassword">新密码</label>
        <div class="field"><input id="resetPassword" type="password" autocomplete="new-password" placeholder="至少 8 位" required></div>
        <label for="resetConfirm">确认新密码</label>
        <div class="field"><input id="resetConfirm" type="password" autocomplete="new-password" placeholder="再次输入新密码" required></div>
        <button type="submit" class="login-btn" id="resetBtn"><span class="spinner"></span><span id="resetLabel">设置新密码</span></button>
        <div class="auth-alt"><a href="#" id="backToLogin2">返回登录</a></div>
      </form>

      <div class="form-foot" id="authFoot"><a href="/admin/">管理后台</a></div>
    </div>
  </section>
</div>

<script>
(function () {
  const basePath = location.pathname.replace(/\/(?:login|register|reset|forgot)(?:\.html)?\/?$/, '/');
  const API = basePath.endsWith('/account/') ? basePath + 'api' : '/account/api';
  function homeFor(data) {
    return data && data.user && data.user.role === 'admin' ? '/admin/' : '/account/';
  }
  const errorBox = document.getElementById('authError');
  const messageBox = document.getElementById('authMessage');
  const tabs = Array.from(document.querySelectorAll('[data-tab]'));
  const forms = {
    login: document.getElementById('loginForm'),
    register: document.getElementById('registerForm'),
    forgot: document.getElementById('forgotForm'),
    reset: document.getElementById('resetForm'),
  };
  let passwordVisible = false;

  function showError(message) {
    errorBox.textContent = message || '操作失败，请稍后再试';
    errorBox.classList.add('show');
  }

  function clearError() {
    errorBox.textContent = '';
    errorBox.classList.remove('show');
  }

  function showMessage(message, kind) {
    messageBox.textContent = message;
    messageBox.className = 'auth-message show ' + (kind || 'ok');
  }

  function setView(name) {
    tabs.forEach(tab => tab.classList.toggle('active', tab.dataset.tab === name));
    Object.entries(forms).forEach(([key, form]) => {
      form.classList.toggle('active', key === name);
    });
    if (name === 'login') document.getElementById('login').focus();
    if (name === 'register') document.getElementById('regUsername').focus();
    if (name === 'forgot') document.getElementById('forgotEmail').focus();
    if (name === 'reset') document.getElementById('resetPassword').focus();
  }

  function setLoading(button, label, loading, idleText) {
    button.disabled = loading;
    button.classList.toggle('loading', loading);
    label.textContent = loading ? '请稍候…' : idleText;
  }

  async function post(path, payload) {
    const response = await fetch(API + path, {
      method: 'POST',
      cache: 'no-store',
      credentials: 'same-origin',
      headers: {
        'Content-Type': 'application/json',
        'X-Requested-With': 'SukiSUThemeAdmin',
      },
      body: JSON.stringify(payload || {}),
    });
    const data = await response.json().catch(() => ({}));
    if (!response.ok || !data.ok) {
      throw new Error(data.error || ('HTTP ' + response.status));
    }
    return data;
  }

  tabs.forEach(tab => {
    tab.addEventListener('click', () => {
      clearError();
      setView(tab.dataset.tab);
    });
  });

  document.getElementById('forgotLink').addEventListener('click', event => {
    event.preventDefault();
    clearError();
    setView('forgot');
  });
  ['backToLogin', 'backToLogin2'].forEach(id => {
    document.getElementById(id).addEventListener('click', event => {
      event.preventDefault();
      clearError();
      setView('login');
    });
  });

  document.getElementById('loginForm').addEventListener('submit', async event => {
    event.preventDefault();
    if (document.getElementById('loginBtn').disabled) return;
    clearError();
    const login = document.getElementById('login').value.trim();
    const password = document.getElementById('password').value;
    if (!login || !password) {
      showError('请输入账号和密码');
      return;
    }
    const button = document.getElementById('loginBtn');
    const label = document.getElementById('loginLabel');
    setLoading(button, label, true, '登录');
    try {
      const data = await post('/auth/login', { login, password });
      const pendingDevice = sessionStorage.getItem('sukisu_device_code');
      if (pendingDevice) {
        sessionStorage.removeItem('sukisu_device_code');
        location.replace(basePath + 'device?code=' + encodeURIComponent(pendingDevice));
      } else {
        location.replace(homeFor(data));
      }
    } catch (error) {
      if (error.message.includes('验证邮箱')) {
        showError('请先打开邮箱完成验证，然后再登录');
      } else {
        showError(error.message);
      }
    } finally {
      setLoading(button, label, false, '登录');
    }
  });

  document.getElementById('registerForm').addEventListener('submit', async event => {
    event.preventDefault();
    if (document.getElementById('registerBtn').disabled) return;
    clearError();
    const username = document.getElementById('regUsername').value.trim();
    const displayName = document.getElementById('regDisplayName').value.trim();
    const email = document.getElementById('regEmail').value.trim();
    const password = document.getElementById('regPassword').value;
    const confirm = document.getElementById('regConfirm').value;
    if (!/^[A-Za-z0-9._-]{3,32}$/.test(username)) {
      showError('用户名需要 3-32 位字母、数字或 . _ -');
      return;
    }
    if (!displayName) {
      showError('请输入显示名称');
      return;
    }
    if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) {
      showError('请输入有效的邮箱地址');
      return;
    }
    if (password.length < 8) {
      showError('密码至少需要 8 位');
      return;
    }
    if (password !== confirm) {
      showError('两次输入的密码不一致');
      return;
    }
    const button = document.getElementById('registerBtn');
    const label = document.getElementById('registerLabel');
    setLoading(button, label, true, '注册账号');
    try {
      const data = await post('/register', { username, displayName, email, password });
      setView('login');
      showMessage(data.message || '验证邮件已发送，请先验证邮箱', 'ok');
      document.getElementById('login').value = username;
    } catch (error) {
      showError(error.message);
    } finally {
      setLoading(button, label, false, '注册账号');
    }
  });

  document.getElementById('forgotForm').addEventListener('submit', async event => {
    event.preventDefault();
    clearError();
    const login = document.getElementById('forgotEmail').value.trim();
    if (!login) {
      showError('请输入邮箱或账号名称');
      return;
    }
    const button = document.getElementById('forgotBtn');
    const label = document.getElementById('forgotLabel');
    setLoading(button, label, true, '发送重置邮件');
    try {
      const data = await post('/auth/forgot-password', { login, email: login });
      showMessage(data.message || '如果该邮箱或账号存在，重置邮件已经发送', 'ok');
    } catch (error) {
      showError(error.message);
    } finally {
      setLoading(button, label, false, '发送重置邮件');
    }
  });

  document.getElementById('resetForm').addEventListener('submit', async event => {
    event.preventDefault();
    clearError();
    const password = document.getElementById('resetPassword').value;
    const confirm = document.getElementById('resetConfirm').value;
    const token = new URLSearchParams(location.search).get('token') || '';
    if (password.length < 8) {
      showError('密码至少需要 8 位');
      return;
    }
    if (password !== confirm) {
      showError('两次输入的密码不一致');
      return;
    }
    const button = document.getElementById('resetBtn');
    const label = document.getElementById('resetLabel');
    setLoading(button, label, true, '设置新密码');
    try {
      const data = await post('/auth/reset-password', { token, password });
      showMessage(data.message || '密码已重置，请重新登录', 'ok');
      history.replaceState(null, '', basePath + 'login');
      setView('login');
    } catch (error) {
      showError(error.message);
    } finally {
      setLoading(button, label, false, '设置新密码');
    }
  });

  document.getElementById('togglePassword').addEventListener('click', () => {
    passwordVisible = !passwordVisible;
    document.getElementById('password').type = passwordVisible ? 'text' : 'password';
  });
  document.getElementById('toggleRegPassword').addEventListener('click', () => {
    const input = document.getElementById('regPassword');
    input.type = input.type === 'password' ? 'text' : 'password';
  });

  async function githubStart() {
    try {
      const response = await fetch(API + '/config', { cache: 'no-store' });
      const data = await response.json().catch(() => ({}));
      if (!data.github) {
        showError('GitHub 登录尚未配置');
        return;
      }
      location.href = API + '/auth/github/start';
    } catch (_) {
      showError('GitHub 登录暂不可用');
    }
  }
  document.getElementById('githubLogin').addEventListener('click', githubStart);
  document.getElementById('githubRegister').addEventListener('click', githubStart);

  document.getElementById('themeToggle').addEventListener('click', () => {
    const next = document.documentElement.dataset.theme === 'light' ? 'dark' : 'light';
    document.documentElement.dataset.theme = next;
    try { localStorage.setItem('sukisu-admin-theme', next); } catch (_) {}
  });

  const params = new URLSearchParams(location.search);
  if (params.get('verified') === '1' || params.get('email') === 'verified') {
    showMessage(params.get('verified') === '1' ? '邮箱验证成功，请登录。' : '新邮箱验证成功。', 'ok');
  } else if (params.get('verify') === 'invalid') {
    showError('验证链接无效或已过期');
  } else if (params.get('github')) {
    const github = params.get('github');
    if (github === '1') showMessage('GitHub 登录成功。', 'ok');
    else if (github === 'denied') showError('你取消了 GitHub 授权');
    else if (github === 'state') showError('GitHub 登录状态已过期，请重试');
    else if (github === 'email') showError('GitHub 账号没有已验证的邮箱');
    else if (github === 'disabled') showError('账号未启用');
    else showError('GitHub 登录失败，请重试');
  }
  if (params.get('token')) {
    setView('reset');
  }

  fetch(API + '/config', { cache: 'no-store' })
    .then(response => response.ok ? response.json() : {})
    .then(data => {
      if (!data.github) {
        document.getElementById('githubLogin').style.display = 'none';
        document.getElementById('githubRegister').style.display = 'none';
      }
    })
    .catch(() => {});

  fetch(API + '/session', { cache: 'no-store', credentials: 'same-origin' })
    .then(response => response.ok ? response.json() : {})
    .then(data => {
      if (data && data.authenticated) location.replace(homeFor(data));
    })
    .catch(() => {});
})();
</script>
</body>
</html>
