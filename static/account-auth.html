<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>登录 · SukiSU 主题镜像</title>
<script>
(function () {
  try {
    var saved = localStorage.getItem('sukisu-admin-theme');
    var light = saved ? saved === 'light' : window.matchMedia('(prefers-color-scheme: light)').matches;
    document.documentElement.dataset.theme = light ? 'light' : 'dark';
  } catch (_) {
    document.documentElement.dataset.theme = 'dark';
  }
})();
</script>
<script src="/i18n.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Urbanist:wght@400;500;600;700;800&family=Fira+Code:wght@400;500;600&display=swap');

:root {
  --font-sans: 'Urbanist', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', 'Noto Sans SC', sans-serif;
  --font-mono: 'Fira Code', 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --bg: #080d1a;
  --panel: rgba(15, 23, 42, .62);
  --panel-2: rgba(30, 41, 59, .72);
  --line: rgba(148, 163, 184, .18);
  --line-strong: rgba(96, 165, 250, .34);
  --text: #edf3ff;
  --muted: #a6b4d4;
  --faint: #7585a8;
  --accent: #67e8f9;
  --accent-2: #60a5fa;
  --accent-3: #a78bfa;
  --ok: #4ade80;
  --bad: #fb7185;
  --shadow: 0 28px 70px rgba(2, 6, 23, .46);
  --grid: rgba(148, 163, 184, .055);
  --input-bg: rgba(2, 6, 18, .36);
  --gradient: linear-gradient(120deg, #22d3ee 0%, #3b82f6 48%, #8b5cf6 100%);
  --gradient-soft: linear-gradient(135deg, rgba(34, 211, 238, .14), rgba(59, 130, 246, .09) 48%, rgba(139, 92, 246, .12));
}
html[data-theme="light"] {
  --bg: #f4f7ff;
  --panel: rgba(255, 255, 255, .72);
  --panel-2: rgba(255, 255, 255, .9);
  --line: rgba(100, 116, 139, .18);
  --line-strong: rgba(37, 99, 235, .26);
  --text: #0f172a;
  --muted: #43536d;
  --faint: #64748b;
  --accent: #0e7490;
  --accent-2: #2563eb;
  --accent-3: #7c3aed;
  --shadow: 0 24px 60px rgba(15, 23, 42, .12);
  --grid: rgba(100, 116, 139, .075);
  --input-bg: rgba(255, 255, 255, .74);
  --gradient-soft: linear-gradient(135deg, rgba(34, 211, 238, .14), rgba(59, 130, 246, .10) 48%, rgba(139, 92, 246, .12));
}

* { box-sizing: border-box; }
html, body { min-height: 100%; }
body {
  margin: 0;
  min-height: 100vh;
  color: var(--text);
  background:
    radial-gradient(900px 560px at 5% -10%, rgba(34, 211, 238, .16), transparent 62%),
    radial-gradient(820px 540px at 100% 2%, rgba(139, 92, 246, .16), transparent 66%),
    radial-gradient(900px 680px at 50% 112%, rgba(59, 130, 246, .13), transparent 66%),
    var(--bg);
  font-family: var(--font-sans);
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}
body::before {
  content: "";
  position: fixed;
  inset: 0;
  z-index: -1;
  pointer-events: none;
  background-image:
    linear-gradient(var(--grid) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 56px 56px;
  mask-image: radial-gradient(circle at 50% 0%, #000 0%, transparent 76%);
  -webkit-mask-image: radial-gradient(circle at 50% 0%, #000 0%, transparent 76%);
}
body::after {
  content: "";
  position: fixed;
  z-index: -1;
  inset: 0;
  pointer-events: none;
  background: radial-gradient(circle at 50% -20%, rgba(96, 165, 250, .12), transparent 55%);
}
::selection { background: rgba(96, 165, 250, .35); }

.login-page {
  min-height: 100vh;
  display: grid;
  place-items: center;
  padding: 72px 26px 34px;
  position: relative;
}
.theme-toggle {
  position: fixed;
  top: 22px;
  right: 24px;
  z-index: 5;
  width: 42px;
  height: 42px;
  display: grid;
  place-items: center;
  border-radius: 13px;
  border: 1px solid var(--line);
  background: var(--panel);
  color: var(--muted);
  cursor: pointer;
  backdrop-filter: blur(18px);
  transition: .2s ease;
}
.theme-toggle:hover { color: var(--text); border-color: var(--line-strong); transform: translateY(-1px); }
.theme-toggle svg { width: 18px; height: 18px; }
html[data-theme="dark"] .sun { display: none; }
html[data-theme="light"] .moon { display: none; }

.login-card {
  width: min(1020px, 100%);
  display: grid;
  grid-template-columns: 1.08fr .92fr;
  overflow: hidden;
  border-radius: 34px;
  border: 1px solid var(--line);
  background: linear-gradient(160deg, var(--panel-2), var(--panel));
  box-shadow: var(--shadow);
  backdrop-filter: blur(26px);
  -webkit-backdrop-filter: blur(26px);
}
.story {
  position: relative;
  overflow: hidden;
  padding: 46px 44px 38px;
  display: flex;
  flex-direction: column;
  gap: 26px;
  background:
    radial-gradient(700px 320px at -10% -10%, rgba(34, 211, 238, .24), transparent 65%),
    radial-gradient(600px 360px at 110% 10%, rgba(139, 92, 246, .24), transparent 62%),
    linear-gradient(150deg, rgba(10, 18, 36, .68), rgba(12, 18, 34, .34));
}
html[data-theme="light"] .story {
  background:
    radial-gradient(700px 320px at -10% -10%, rgba(34, 211, 238, .20), transparent 65%),
    radial-gradient(600px 360px at 110% 10%, rgba(139, 92, 246, .18), transparent 62%),
    linear-gradient(150deg, rgba(255, 255, 255, .64), rgba(255, 255, 255, .3));
}
.story::after {
  content: "";
  position: absolute;
  inset: 0;
  pointer-events: none;
  background: linear-gradient(120deg, transparent 30%, rgba(255, 255, 255, .05) 48%, transparent 64%);
}
.brand { display: flex; align-items: center; gap: 14px; position: relative; z-index: 1; }
.brand .logo {
  width: 52px;
  height: 52px;
  border-radius: 17px;
  display: grid;
  place-items: center;
  background: var(--gradient-soft);
  border: 1px solid var(--line-strong);
  box-shadow: 0 14px 34px rgba(37, 99, 235, .24), inset 0 1px 0 rgba(255, 255, 255, .2);
}
.brand .logo img { width: 36px; height: 36px; display: block; }
.brand h1 { margin: 0; font-size: 17px; font-weight: 760; letter-spacing: -.01em; }
.brand p { margin: 3px 0 0; color: var(--faint); font-size: 11.5px; letter-spacing: .08em; text-transform: uppercase; }
.story h2 {
  margin: 6px 0 0;
  font-size: clamp(30px, 4vw, 42px);
  line-height: 1.08;
  letter-spacing: -.045em;
  font-weight: 800;
  position: relative;
  z-index: 1;
}
.story h2 em { font-style: normal; background: var(--gradient); -webkit-background-clip: text; background-clip: text; color: transparent; }
.story > p { margin: 0; max-width: 42ch; color: var(--muted); font-size: 14px; line-height: 1.75; position: relative; z-index: 1; }
.features { display: grid; gap: 12px; margin-top: auto; position: relative; z-index: 1; }
.feature {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px 14px;
  border-radius: 15px;
  border: 1px solid var(--line);
  background: rgba(2, 6, 18, .22);
  color: var(--muted);
  font-size: 12.5px;
  line-height: 1.45;
}
html[data-theme="light"] .feature { background: rgba(255, 255, 255, .46); }
.feature i {
  flex: none;
  width: 34px;
  height: 34px;
  border-radius: 11px;
  display: grid;
  place-items: center;
  background: var(--gradient-soft);
  border: 1px solid var(--line-strong);
  color: var(--accent);
}
.feature i svg { width: 17px; height: 17px; }
.feature b { display: block; color: var(--text); font-size: 12.5px; font-weight: 650; }
.feature span { color: var(--faint); font-size: 11.5px; }
.story-foot { position: relative; z-index: 1; display: flex; gap: 8px; align-items: center; color: var(--faint); font-size: 11px; letter-spacing: .04em; }
.story-foot .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--ok); box-shadow: 0 0 0 4px rgba(74, 222, 128, .12); }

.form-panel {
  padding: 46px 44px 36px;
  display: flex;
  flex-direction: column;
  justify-content: center;
  gap: 0;
  background: linear-gradient(180deg, rgba(2, 6, 18, .18), rgba(2, 6, 18, .04));
}
html[data-theme="light"] .form-panel { background: linear-gradient(180deg, rgba(255, 255, 255, .22), rgba(255, 255, 255, .04)); }
.form-panel h3 { margin: 0; font-size: 25px; letter-spacing: -.03em; font-weight: 780; }
.form-panel .lead { margin: 7px 0 24px; color: var(--faint); font-size: 12.5px; line-height: 1.65; }
label { display: block; margin: 0 0 7px; color: var(--muted); font-size: 12px; font-weight: 550; }
.field { position: relative; margin-bottom: 14px; }
input {
  width: 100%;
  height: 50px;
  padding: 0 48px 0 15px;
  color: var(--text);
  background: var(--input-bg);
  border: 1px solid var(--line);
  border-radius: 14px;
  font: inherit;
  font-size: 14px;
  outline: none;
  transition: .2s ease;
}
input:focus { border-color: var(--line-strong); box-shadow: 0 0 0 4px rgba(96, 165, 250, .10); background: var(--panel-2); }
input::placeholder { color: var(--faint); }
.field .eye {
  position: absolute;
  right: 7px;
  top: 7px;
  width: 36px;
  height: 36px;
  border: 0;
  border-radius: 10px;
  background: var(--panel-2);
  color: var(--muted);
  display: grid;
  place-items: center;
  cursor: pointer;
  transition: .18s ease;
}
.field .eye:hover { color: var(--text); background: var(--gradient-soft); }
.field .eye svg { width: 17px; height: 17px; }
.login-error {
  display: none;
  margin: 0 0 14px;
  padding: 11px 13px;
  border-radius: 12px;
  border: 1px solid rgba(251, 113, 133, .36);
  background: rgba(251, 113, 133, .09);
  color: var(--bad);
  font-size: 12.5px;
  line-height: 1.5;
}
.login-error.show { display: block; }
.login-btn {
  width: 100%;
  height: 50px;
  margin-top: 6px;
  border: 0;
  border-radius: 14px;
  background: var(--gradient);
  color: #fff;
  font: inherit;
  font-size: 14px;
  font-weight: 700;
  letter-spacing: .01em;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 9px;
  cursor: pointer;
  box-shadow: 0 16px 38px rgba(37, 99, 235, .3);
  transition: .2s ease;
}
.login-btn:hover { transform: translateY(-1px); box-shadow: 0 20px 44px rgba(37, 99, 235, .38); }
.login-btn:disabled { opacity: .72; cursor: wait; transform: none; }
.spinner {
  width: 16px;
  height: 16px;
  border-radius: 50%;
  border: 2px solid rgba(255, 255, 255, .34);
  border-top-color: #fff;
  animation: spin .8s linear infinite;
  display: none;
}
.login-btn.loading .spinner { display: block; }
@keyframes spin { to { transform: rotate(360deg); } }
.login-meta {
  margin: 18px 0 0;
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
  color: var(--faint);
  font-size: 11.5px;
  line-height: 1.5;
}
.login-meta .pill {
  padding: 4px 9px;
  border-radius: 99px;
  border: 1px solid var(--line);
  background: var(--panel-2);
  color: var(--muted);
  font-family: var(--font-mono);
  font-size: 10.5px;
}
.form-foot {
  margin-top: 26px;
  padding-top: 16px;
  border-top: 1px solid var(--line);
  color: var(--faint);
  font-size: 11px;
  line-height: 1.6;
}
.form-foot a { color: var(--muted); text-decoration: none; }
.form-foot a:hover { color: var(--text); }
.auth-tabs { display: flex; gap: 6px; padding: 4px; border-radius: 12px; background: var(--input-bg); border: 1px solid var(--line); margin-bottom: 20px; }
.auth-tabs button { flex: 1; height: 34px; border: 0; border-radius: 9px; background: transparent; color: var(--faint); font-size: 12px; font-weight: 700; }
.auth-tabs button.active { color: var(--text); background: var(--gradient-soft); border: 1px solid var(--line-strong); }
.auth-form { display: none; }
.auth-form.active { display: block; }
.auth-alt { margin-top: 14px; text-align: center; color: var(--faint); font-size: 11.5px; }
.auth-alt a, .forgot-link { color: var(--accent-2); text-decoration: none; }
.forgot-link { display: block; text-align: right; font-size: 11px; margin: -8px 0 12px; }
.github-btn { width: 100%; height: 44px; margin-top: 10px; border-radius: 12px; border: 1px solid var(--line-strong); background: var(--input-bg); color: var(--text); font-weight: 650; font-size: 12.5px; }
.github-btn:hover { border-color: var(--text); }
.auth-message { display: none; margin-bottom: 14px; padding: 10px 12px; border-radius: 10px; font-size: 12px; line-height: 1.6; border: 1px solid var(--line); color: var(--muted); background: var(--input-bg); }
.auth-message.show { display: block; }
.auth-message.ok { color: var(--ok); border-color: rgba(74, 222, 128, .28); background: rgba(74, 222, 128, .08); }
.auth-message.bad { color: var(--bad); border-color: rgba(251, 113, 133, .28); background: rgba(251, 113, 133, .08); }

@media (max-width: 860px) {
  .login-card { grid-template-columns: 1fr; }
  .story { padding: 32px 28px 26px; gap: 18px; }
  .story h2 { font-size: 30px; }
  .features { display: none; }
  .story-foot { display: none; }
  .form-panel { padding: 30px 28px 30px; }
  .login-page { padding-top: 64px; }
}
@media (max-width: 520px) {
  .login-page { padding: 58px 14px 20px; }
  .login-card { border-radius: 26px; }
  .story { padding: 26px 22px 20px; }
  .form-panel { padding: 26px 22px 26px; }
  .theme-toggle { top: 14px; right: 14px; }
}

/* Minimal login: one centered card, no marketing panel. */
.login-card { display: block; width: min(440px, 100%); }
.story { display: none; }
.form-panel { padding: 36px 34px 30px; }
.form-brand { display: flex; align-items: center; gap: 11px; margin-bottom: 22px; }
.form-brand img { width: 42px; height: 42px; border-radius: 13px; background: var(--gradient-soft); }
.form-brand b { display: block; font-size: 15px; }
.form-brand span { display: block; margin-top: 2px; color: var(--faint); font-size: 11px; letter-spacing: .06em; }
@media (max-width: 520px) { .form-panel { padding: 28px 22px; } }

/* ── SukiSU Website theme ───────────────────────────────────────────── */
:root {
  color-scheme: dark;
  --bg: #303446;
  --bg-alt: #292c3c;
  --bg-elv: #414559;
  --panel: #292c3c;
  --panel-2: #313547;
  --line: #414559;
  --line-strong: rgba(129, 200, 190, .45);
  --text: #c6d0f5;
  --muted: #b5bfe2;
  --faint: #838ba7;
  --accent: #81c8be;
  --accent-2: #8caaee;
  --accent-3: #babbf1;
  --ok: #a6d189;
  --bad: #e78284;
  --shadow: 0 24px 60px rgba(0, 0, 0, .22);
  --input-bg: #232634;
  --gradient: linear-gradient(120deg, #81c8be, #8caaee 55%, #babbf1);
  --gradient-soft: rgba(129, 200, 190, .13);
  --brand: #81c8be;
  --brand-2: #70c0b6;
  --brand-soft: rgba(129, 200, 190, .14);
  --on-brand: #232634;
}
html[data-theme="light"] {
  color-scheme: light;
  --bg: #eff1f5;
  --bg-alt: #e6e9ef;
  --bg-elv: #dce0e8;
  --panel: #e6e9ef;
  --panel-2: #ffffff;
  --line: #ccd0da;
  --line-strong: rgba(23, 146, 153, .32);
  --text: #4c4f69;
  --muted: #5c5f77;
  --faint: #6c6f85;
  --accent: #179299;
  --accent-2: #1e66f5;
  --accent-3: #7287fd;
  --ok: #40a02b;
  --bad: #d20f39;
  --shadow: 0 24px 60px rgba(76, 79, 105, .1);
  --input-bg: #eff1f5;
  --gradient: linear-gradient(120deg, #179299, #1e66f5 55%, #7287fd);
  --gradient-soft: rgba(23, 146, 153, .09);
  --brand: #179299;
  --brand-2: #147d82;
  --brand-soft: rgba(23, 146, 153, .1);
  --on-brand: #ffffff;
}
body {
  background:
    radial-gradient(ellipse 70% 45% at 50% -10%, color-mix(in srgb, var(--brand) 16%, transparent), transparent 70%),
    var(--bg);
  color: var(--text);
}
body::before {
  background-image:
    linear-gradient(var(--line) 1px, transparent 1px),
    linear-gradient(90deg, var(--line) 1px, transparent 1px);
  background-size: 56px 56px;
  opacity: .3;
  mask-image: radial-gradient(80% 55% at 50% 0%, #000 20%, transparent 75%);
  -webkit-mask-image: radial-gradient(80% 55% at 50% 0%, #000 20%, transparent 75%);
}
body::after { display: none; }
.login-card {
  background: var(--bg-alt);
  border: 1px solid var(--line);
  border-radius: 20px;
  box-shadow: var(--shadow);
  backdrop-filter: none;
  -webkit-backdrop-filter: none;
}
.form-panel { background: transparent; }
.form-panel h3 { font-weight: 800; letter-spacing: -.03em; }
.form-panel .lead { color: var(--muted); }
.form-brand img { background: var(--brand-soft); border: 1px solid var(--line); }
.form-brand span { color: var(--faint); }
.theme-toggle {
  width: 40px;
  height: 40px;
  background: var(--bg-alt);
  border-color: var(--line);
  color: var(--muted);
  border-radius: 999px;
}
.theme-toggle:hover { color: var(--text); border-color: var(--line-strong); }
input {
  background: var(--input-bg);
  border: 1px solid var(--line);
  border-radius: 10px;
  color: var(--text);
}
input:focus {
  border-color: var(--brand);
  box-shadow: 0 0 0 3px color-mix(in srgb, var(--brand) 18%, transparent);
  background: var(--bg);
}
label { color: var(--muted); }
.field .eye {
  right: 10px;
  top: 10px;
  width: 30px;
  height: 30px;
  border: 0;
  border-radius: 999px;
  background: transparent;
  color: var(--faint);
}
.field .eye:hover { background: var(--brand-soft); color: var(--brand); }
.login-btn {
  background: var(--brand);
  color: var(--on-brand);
  border-radius: 10px;
  box-shadow: 0 8px 24px -12px color-mix(in srgb, var(--brand) 80%, transparent);
}
.login-btn:hover { background: var(--brand-2); box-shadow: none; transform: none; }
.github-btn {
  background: var(--bg-elv);
  border: 1px solid var(--line);
  border-radius: 10px;
  color: var(--text);
}
.github-btn:hover { border-color: var(--line-strong); }
.auth-tabs {
  background: var(--bg);
  border: 1px solid var(--line);
  border-radius: 12px;
}
.auth-tabs button { border-radius: 8px; color: var(--faint); }
.auth-tabs button.active {
  color: var(--brand);
  background: var(--brand-soft);
  border-color: color-mix(in srgb, var(--brand) 30%, transparent);
}
.auth-alt a, .forgot-link { color: var(--brand); }
.auth-message { background: var(--bg); border-color: var(--line); color: var(--muted); }
.auth-message.ok { color: var(--ok); border-color: color-mix(in srgb, var(--ok) 32%, transparent); background: color-mix(in srgb, var(--ok) 9%, transparent); }
.auth-message.bad { color: var(--bad); border-color: color-mix(in srgb, var(--bad) 32%, transparent); background: color-mix(in srgb, var(--bad) 9%, transparent); }
.login-error { border-color: color-mix(in srgb, var(--bad) 36%, transparent); background: color-mix(in srgb, var(--bad) 9%, transparent); color: var(--bad); }
.form-foot { border-top-color: var(--line); color: var(--faint); }
.form-foot a { color: var(--muted); }
.form-foot a:hover { color: var(--brand); }
input:-webkit-autofill,
input:-webkit-autofill:hover,
input:-webkit-autofill:focus {
  -webkit-text-fill-color: var(--text);
  -webkit-box-shadow: 0 0 0 1000px var(--input-bg) inset;
  caret-color: var(--text);
  transition: background-color 9999s ease-out 0s;
}

.brand .logo img, .form-brand img { object-fit: contain; background: #fff; }

</style>
</head>
<body>
<div class="login-page">
  <button class="theme-toggle" id="themeToggle" title="切换深色/浅色" aria-label="切换深色/浅色">
    <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M20.5 14.2A8.5 8.5 0 0 1 9.8 3.5 8.5 8.5 0 1 0 20.5 14.2Z"/></svg>
    <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2.2M12 19.8V22M2 12h2.2M19.8 12H22M4.9 4.9l1.6 1.6M17.5 17.5l1.6 1.6M19.1 4.9l-1.6 1.6M6.5 17.5l-1.6 1.6"/></svg>
  </button>
  <div class="lang-switch lang-switch-fixed" data-lang-switcher></div>

  <section class="login-card">
    <div class="story">
      <div class="brand">
        <div class="logo"><img src="/account/logo.svg" alt="SukiSU Ultra"></div>
        <div><h1>SukiSU 主题镜像</h1><p>Theme mirror console</p></div>
      </div>
      <h2>管理你的<br><em>主题镜像</em></h2>
      <p>使用同一个账号登录；作者可以投稿和管理主题，管理员会看到审核与管理功能。</p>
      <div class="features">
        <div class="feature">
          <i><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="8" r="3.2"/><path d="M5 20c.8-4 3.1-6 7-6s6.2 2 7 6"/></svg></i>
          <div><b>账号资料</b><span>用户名、邮箱、密码和头像</span></div>
        </div>
        <div class="feature">
          <i><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M15 7a4 4 0 1 1-3.8 5.2L4 19.4V21h2.6l1.4-1.4V18h1.6l1.2-1.2v-1.4h1.4l.8-.8A4 4 0 0 1 15 7Z"/><circle cx="16.5" cy="7.5" r="1"/></svg></i>
          <div><b>作者绑定</b><span>复用已有作者 ID，或申请新的身份</span></div>
        </div>
        <div class="feature">
          <i><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M5 5h14v14H5z"/><path d="M8 9h8M8 13h5"/></svg></i>
          <div><b>投稿记录</b><span>查看审核状态、已发布主题和撤回</span></div>
        </div>
      </div>
    </div>

    <div class="form-panel">
      <div class="form-brand"><img src="/account/logo.svg" alt="SukiSU"><div><b>SukiSU 主题镜像</b><span>统一登录</span></div></div>
      <h3>登录或注册</h3>
      <p class="lead">使用同一个账号登录；系统会根据账号权限显示对应功能。</p>
      <div class="auth-tabs" id="authTabs">
        <button type="button" data-tab="login" class="active">登录</button>
        <button type="button" data-tab="register">注册</button>
      </div>
      <div class="auth-message" id="authMessage" role="status"></div>
      <div class="login-error" id="authError" role="alert"></div>

      <form id="loginForm" class="auth-form active" autocomplete="on">
        <label for="login">用户名或邮箱</label>
        <div class="field">
          <input id="login" name="login" autocomplete="username" spellcheck="false" placeholder="用户名或邮箱" required>
        </div>
        <label for="password">密码</label>
        <div class="field">
          <input id="password" name="password" type="password" autocomplete="current-password" placeholder="输入密码" required>
          <button type="button" class="eye" id="togglePassword" title="显示/隐藏密码" aria-label="显示或隐藏密码">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M2.5 12S6 6.5 12 6.5 21.5 12 21.5 12 18 17.5 12 17.5 2.5 12 2.5 12Z"/><circle cx="12" cy="12" r="2.7"/></svg>
          </button>
        </div>
        <a class="forgot-link" href="#" id="forgotLink">忘记密码？</a>
        <button type="submit" class="login-btn" id="loginBtn"><span class="spinner"></span><span id="loginLabel">登录</span></button>
        <button type="button" class="github-btn" id="githubLogin">使用 GitHub 登录</button>
      </form>

      <form id="registerForm" class="auth-form" autocomplete="on">
        <label for="regUsername">用户名</label>
        <div class="field"><input id="regUsername" name="username" autocomplete="username" spellcheck="false" placeholder="3-32 位字母、数字或 . _ -" required></div>
        <label for="regDisplayName">显示名称</label>
        <div class="field"><input id="regDisplayName" name="displayName" autocomplete="nickname" placeholder="主题作者显示名称" required></div>
        <label for="regEmail">邮箱</label>
        <div class="field"><input id="regEmail" name="email" type="email" autocomplete="email" placeholder="用于验证和找回密码" required></div>
        <label for="regPassword">密码</label>
        <div class="field">
          <input id="regPassword" name="password" type="password" autocomplete="new-password" placeholder="至少 8 位" required>
          <button type="button" class="eye" id="toggleRegPassword" title="显示/隐藏密码" aria-label="显示或隐藏密码">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M2.5 12S6 6.5 12 6.5 21.5 12 21.5 12 18 17.5 12 17.5 2.5 12 2.5 12Z"/><circle cx="12" cy="12" r="2.7"/></svg>
          </button>
        </div>
        <label for="regConfirm">确认密码</label>
        <div class="field"><input id="regConfirm" name="confirmPassword" type="password" autocomplete="new-password" placeholder="再次输入密码" required></div>
        <button type="submit" class="login-btn" id="registerBtn"><span class="spinner"></span><span id="registerLabel">注册账号</span></button>
        <button type="button" class="github-btn" id="githubRegister">使用 GitHub 注册</button>
      </form>

      <form id="forgotForm" class="auth-form" autocomplete="on">
        <label for="forgotEmail">邮箱或账号名称</label>
        <div class="field"><input id="forgotEmail" name="login" type="text" autocomplete="username" placeholder="注册邮箱或账号名称" required></div>
        <button type="submit" class="login-btn" id="forgotBtn"><span class="spinner"></span><span id="forgotLabel">发送重置邮件</span></button>
        <div class="auth-alt"><a href="#" id="backToLogin">返回登录</a></div>
      </form>

      <form id="resetForm" class="auth-form" autocomplete="on">
        <label for="resetPassword">新密码</label>
        <div class="field"><input id="resetPassword" type="password" autocomplete="new-password" placeholder="至少 8 位" required></div>
        <label for="resetConfirm">确认新密码</label>
        <div class="field"><input id="resetConfirm" type="password" autocomplete="new-password" placeholder="再次输入新密码" required></div>
        <button type="submit" class="login-btn" id="resetBtn"><span class="spinner"></span><span id="resetLabel">设置新密码</span></button>
        <div class="auth-alt"><a href="#" id="backToLogin2">返回登录</a></div>
      </form>

      <div class="form-foot" id="authFoot"><a href="/admin/">管理后台</a></div>
    </div>
  </section>
</div>

<script>
(function () {
  const basePath = location.pathname.replace(/\/(?:login|register|reset|forgot)(?:\.html)?\/?$/, '/');
  const API = basePath.endsWith('/account/') ? basePath + 'api' : '/account/api';
  function homeFor(data) {
    return data && data.user && data.user.role === 'admin' ? '/admin/' : '/account/';
  }
  const errorBox = document.getElementById('authError');
  const messageBox = document.getElementById('authMessage');
  const tabs = Array.from(document.querySelectorAll('[data-tab]'));
  const forms = {
    login: document.getElementById('loginForm'),
    register: document.getElementById('registerForm'),
    forgot: document.getElementById('forgotForm'),
    reset: document.getElementById('resetForm'),
  };
  let passwordVisible = false;

  function showError(message) {
    errorBox.textContent = message || '操作失败，请稍后再试';
    errorBox.classList.add('show');
  }

  function clearError() {
    errorBox.textContent = '';
    errorBox.classList.remove('show');
  }

  function showMessage(message, kind) {
    messageBox.textContent = message;
    messageBox.className = 'auth-message show ' + (kind || 'ok');
  }

  function setView(name) {
    tabs.forEach(tab => tab.classList.toggle('active', tab.dataset.tab === name));
    Object.entries(forms).forEach(([key, form]) => {
      form.classList.toggle('active', key === name);
    });
    if (name === 'login') document.getElementById('login').focus();
    if (name === 'register') document.getElementById('regUsername').focus();
    if (name === 'forgot') document.getElementById('forgotEmail').focus();
    if (name === 'reset') document.getElementById('resetPassword').focus();
  }

  function setLoading(button, label, loading, idleText) {
    button.disabled = loading;
    button.classList.toggle('loading', loading);
    label.textContent = loading ? '请稍候…' : idleText;
  }

  async function post(path, payload) {
    const response = await fetch(API + path, {
      method: 'POST',
      cache: 'no-store',
      credentials: 'same-origin',
      headers: {
        'Content-Type': 'application/json',
        'X-Requested-With': 'SukiSUThemeAdmin',
      },
      body: JSON.stringify(payload || {}),
    });
    const data = await response.json().catch(() => ({}));
    if (!response.ok || !data.ok) {
      throw new Error(data.error || ('HTTP ' + response.status));
    }
    return data;
  }

  tabs.forEach(tab => {
    tab.addEventListener('click', () => {
      clearError();
      setView(tab.dataset.tab);
    });
  });

  document.getElementById('forgotLink').addEventListener('click', event => {
    event.preventDefault();
    clearError();
    setView('forgot');
  });
  ['backToLogin', 'backToLogin2'].forEach(id => {
    document.getElementById(id).addEventListener('click', event => {
      event.preventDefault();
      clearError();
      setView('login');
    });
  });

  document.getElementById('loginForm').addEventListener('submit', async event => {
    event.preventDefault();
    if (document.getElementById('loginBtn').disabled) return;
    clearError();
    const login = document.getElementById('login').value.trim();
    const password = document.getElementById('password').value;
    if (!login || !password) {
      showError('请输入账号和密码');
      return;
    }
    const button = document.getElementById('loginBtn');
    const label = document.getElementById('loginLabel');
    setLoading(button, label, true, '登录');
    try {
      const data = await post('/auth/login', { login, password });
      const pendingDevice = sessionStorage.getItem('sukisu_device_code');
      if (pendingDevice) {
        sessionStorage.removeItem('sukisu_device_code');
        location.replace(basePath + 'device?code=' + encodeURIComponent(pendingDevice));
      } else {
        location.replace(homeFor(data));
      }
    } catch (error) {
      if (error.message.includes('验证邮箱')) {
        showError('请先打开邮箱完成验证，然后再登录');
      } else {
        showError(error.message);
      }
    } finally {
      setLoading(button, label, false, '登录');
    }
  });

  document.getElementById('registerForm').addEventListener('submit', async event => {
    event.preventDefault();
    if (document.getElementById('registerBtn').disabled) return;
    clearError();
    const username = document.getElementById('regUsername').value.trim();
    const displayName = document.getElementById('regDisplayName').value.trim();
    const email = document.getElementById('regEmail').value.trim();
    const password = document.getElementById('regPassword').value;
    const confirm = document.getElementById('regConfirm').value;
    if (!/^[A-Za-z0-9._-]{3,32}$/.test(username)) {
      showError('用户名需要 3-32 位字母、数字或 . _ -');
      return;
    }
    if (!displayName) {
      showError('请输入显示名称');
      return;
    }
    if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) {
      showError('请输入有效的邮箱地址');
      return;
    }
    if (password.length < 8) {
      showError('密码至少需要 8 位');
      return;
    }
    if (password !== confirm) {
      showError('两次输入的密码不一致');
      return;
    }
    const button = document.getElementById('registerBtn');
    const label = document.getElementById('registerLabel');
    setLoading(button, label, true, '注册账号');
    try {
      const data = await post('/register', { username, displayName, email, password });
      setView('login');
      showMessage(data.message || '验证邮件已发送，请先验证邮箱', 'ok');
      document.getElementById('login').value = username;
    } catch (error) {
      showError(error.message);
    } finally {
      setLoading(button, label, false, '注册账号');
    }
  });

  document.getElementById('forgotForm').addEventListener('submit', async event => {
    event.preventDefault();
    clearError();
    const login = document.getElementById('forgotEmail').value.trim();
    if (!login) {
      showError('请输入邮箱或账号名称');
      return;
    }
    const button = document.getElementById('forgotBtn');
    const label = document.getElementById('forgotLabel');
    setLoading(button, label, true, '发送重置邮件');
    try {
      const data = await post('/auth/forgot-password', { login, email: login });
      showMessage(data.message || '如果该邮箱或账号存在，重置邮件已经发送', 'ok');
    } catch (error) {
      showError(error.message);
    } finally {
      setLoading(button, label, false, '发送重置邮件');
    }
  });

  document.getElementById('resetForm').addEventListener('submit', async event => {
    event.preventDefault();
    clearError();
    const password = document.getElementById('resetPassword').value;
    const confirm = document.getElementById('resetConfirm').value;
    const token = new URLSearchParams(location.search).get('token') || '';
    if (password.length < 8) {
      showError('密码至少需要 8 位');
      return;
    }
    if (password !== confirm) {
      showError('两次输入的密码不一致');
      return;
    }
    const button = document.getElementById('resetBtn');
    const label = document.getElementById('resetLabel');
    setLoading(button, label, true, '设置新密码');
    try {
      const data = await post('/auth/reset-password', { token, password });
      showMessage(data.message || '密码已重置，请重新登录', 'ok');
      history.replaceState(null, '', basePath + 'login');
      setView('login');
    } catch (error) {
      showError(error.message);
    } finally {
      setLoading(button, label, false, '设置新密码');
    }
  });

  document.getElementById('togglePassword').addEventListener('click', () => {
    passwordVisible = !passwordVisible;
    document.getElementById('password').type = passwordVisible ? 'text' : 'password';
  });
  document.getElementById('toggleRegPassword').addEventListener('click', () => {
    const input = document.getElementById('regPassword');
    input.type = input.type === 'password' ? 'text' : 'password';
  });

  async function githubStart() {
    try {
      const response = await fetch(API + '/config', { cache: 'no-store' });
      const data = await response.json().catch(() => ({}));
      if (!data.github) {
        showError('GitHub 登录尚未配置');
        return;
      }
      location.href = API + '/auth/github/start';
    } catch (_) {
      showError('GitHub 登录暂不可用');
    }
  }
  document.getElementById('githubLogin').addEventListener('click', githubStart);
  document.getElementById('githubRegister').addEventListener('click', githubStart);

  document.getElementById('themeToggle').addEventListener('click', () => {
    const next = document.documentElement.dataset.theme === 'light' ? 'dark' : 'light';
    document.documentElement.dataset.theme = next;
    try { localStorage.setItem('sukisu-admin-theme', next); } catch (_) {}
  });

  const params = new URLSearchParams(location.search);
  if (params.get('verified') === '1' || params.get('email') === 'verified') {
    showMessage(params.get('verified') === '1' ? '邮箱验证成功，请登录。' : '新邮箱验证成功。', 'ok');
  } else if (params.get('verify') === 'invalid') {
    showError('验证链接无效或已过期');
  } else if (params.get('github')) {
    const github = params.get('github');
    if (github === '1') showMessage('GitHub 登录成功。', 'ok');
    else if (github === 'denied') showError('你取消了 GitHub 授权');
    else if (github === 'state') showError('GitHub 登录状态已过期，请重试');
    else if (github === 'email') showError('GitHub 账号没有已验证的邮箱');
    else if (github === 'disabled') showError('账号未启用');
    else showError('GitHub 登录失败，请重试');
  }
  if (params.get('token')) {
    setView('reset');
  }

  fetch(API + '/config', { cache: 'no-store' })
    .then(response => response.ok ? response.json() : {})
    .then(data => {
      if (!data.github) {
        document.getElementById('githubLogin').style.display = 'none';
        document.getElementById('githubRegister').style.display = 'none';
      }
    })
    .catch(() => {});

  fetch(API + '/session', { cache: 'no-store', credentials: 'same-origin' })
    .then(response => response.ok ? response.json() : {})
    .then(data => {
      if (data && data.authenticated) location.replace(homeFor(data));
    })
    .catch(() => {});
})();
</script>
</body>
</html>
