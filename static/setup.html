<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>初始化 · SukiSU 主题镜像控制台</title>
<script>
(function () {
  try {
    var saved = localStorage.getItem('sukisu-admin-theme');
    var light = saved ? saved === 'light' : window.matchMedia('(prefers-color-scheme: light)').matches;
    document.documentElement.dataset.theme = light ? 'light' : 'dark';
  } catch (_) {
    document.documentElement.dataset.theme = 'dark';
  }
})();
</script>
<script src="/i18n.js"></script>
<link rel="stylesheet" href="/app.css">
</head>
<body>
<div class="login-page">
  <button class="theme-toggle" id="themeToggle" title="切换深色/浅色" aria-label="切换深色/浅色">
    <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M20.5 14.2A8.5 8.5 0 0 1 9.8 3.5 8.5 8.5 0 1 0 20.5 14.2Z"/></svg>
    <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2.2M12 19.8V22M2 12h2.2M19.8 12H22M4.9 4.9l1.6 1.6M17.5 17.5l1.6 1.6M19.1 4.9l-1.6 1.6M6.5 17.5l-1.6 1.6"/></svg>
  </button>
  <div class="lang-switch lang-switch-fixed" data-lang-switcher></div>

  <section class="login-card">
    <div class="story">
      <div class="brand">
        <div class="logo"><img src="logo.svg" alt="SukiSU Ultra"></div>
        <div><h1>SukiSU 主题镜像</h1><p>Theme mirror console</p></div>
      </div>
      <h2>初始化你的<br><em>主题镜像站</em></h2>
      <p>首次使用需要创建管理员账户，并为主题资源设置一个存储配额。完成后会自动登录控制台。</p>
      <div class="features">
        <div class="feature">
          <i><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="8" r="3.2"/><path d="M5 20c.8-4 3.1-6 7-6s6.2 2 7 6"/></svg></i>
          <div><b>管理员账户</b><span>用户名与密码只保存在服务器</span></div>
        </div>
        <div class="feature">
          <i><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><ellipse cx="12" cy="5.5" rx="7.5" ry="3"/><path d="M4.5 5.5v6c0 1.7 3.4 3 7.5 3s7.5-1.3 7.5-3v-6"/><path d="M4.5 11.5v6c0 1.7 3.4 3 7.5 3s7.5-1.3 7.5-3v-6"/></svg></i>
          <div><b>存储与配额</b><span>选择数据目录并设置初始容量</span></div>
        </div>
      </div>
    </div>

    <div class="form-panel">
      <h3>初始化控制台</h3>
      <p class="lead">创建第一个管理员账户，选择存储位置并设置主题资源配额。</p>
      <div class="login-error" id="setupError" role="alert"></div>
      <form id="setupForm" autocomplete="on">
        <label for="username">管理员用户名</label>
        <div class="field">
          <input id="username" name="username" value="admin" autocomplete="username" spellcheck="false" placeholder="3-32 位字母、数字或 . _ -" required>
        </div>
        <label for="password">管理员密码</label>
        <div class="field">
          <input id="password" name="password" type="password" autocomplete="new-password" placeholder="至少 8 位" required>
          <button type="button" class="eye" id="togglePassword" title="显示/隐藏密码" aria-label="显示或隐藏密码">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M2.5 12S6 6.5 12 6.5 21.5 12 21.5 12 18 17.5 12 17.5 2.5 12 2.5 12Z"/><circle cx="12" cy="12" r="2.7"/></svg>
          </button>
        </div>
        <label for="confirmPassword">确认密码</label>
        <div class="field">
          <input id="confirmPassword" name="confirmPassword" type="password" autocomplete="new-password" placeholder="再次输入密码" required>
        </div>
        <label for="limitMb">存储配额</label>
        <div class="quota-presets" id="quotaPresets">
          <button type="button" data-quota="1024">1 GB</button>
          <button type="button" data-quota="2048">2 GB</button>
          <button type="button" data-quota="5120">5 GB</button>
          <button type="button" data-quota="10240">10 GB</button>
        </div>
        <div class="field quota-field">
          <input id="limitMb" name="limitMb" type="number" min="64" max="10485760" step="64" value="1024" required>
          <span class="quota-unit">MB</span>
        </div>
        <p class="setup-note">配额限制主题包、预览图、截图、头像和待审核文件的总大小。之后可在「设置 → 存储」中调整。</p>
        <label for="storageRoot">存储位置</label>
        <div class="path-options" id="pathOptions">
          <button type="button" data-root="/srv/sukisu-themes" class="active"><b>/srv/sukisu-themes</b><span>推荐 · 数据盘</span></button>
          <button type="button" data-root="/var/lib/sukisu-themes"><b>/var/lib/sukisu-themes</b><span>系统数据目录</span></button>
          <button type="button" data-root="/opt/sukisu-themes"><b>/opt/sukisu-themes</b><span>应用目录</span></button>
          <button type="button" data-root="/home/sukisu/themes"><b>/home/sukisu/themes</b><span>用户目录</span></button>
        </div>
        <div class="field">
          <input id="storageRoot" name="storageRoot" value="/srv/sukisu-themes" placeholder="/srv/sukisu-themes" spellcheck="false" required>
        </div>
        <p class="setup-note">可以选择常用位置，或直接输入自定义绝对路径。目录需要可写；迁移完成并重启服务后生效。</p>
        <button type="submit" class="login-btn" id="setupBtn"><span class="spinner"></span><span id="setupLabel">完成初始化</span></button>
      </form>
    </div>
  </section>
</div>

<script>
(function () {
  const basePath = '/admin/';
  const API = (location.pathname.startsWith('/admin') ? '/admin' : '') + '/api';
  const LOGIN_URL = '/account/login';
  const form = document.getElementById('setupForm');
  const errorBox = document.getElementById('setupError');
  const setupBtn = document.getElementById('setupBtn');
  const setupLabel = document.getElementById('setupLabel');
  const passwordInput = document.getElementById('password');
  const confirmInput = document.getElementById('confirmPassword');
  const usernameInput = document.getElementById('username');
  const limitInput = document.getElementById('limitMb');
  const storageRootInput = document.getElementById('storageRoot');
  const pathOptions = Array.from(document.querySelectorAll('[data-root]'));
  const presets = Array.from(document.querySelectorAll('[data-quota]'));
  let passwordVisible = false;
  let submitting = false;
  let adminCreated = false;
  let setupComplete = false;

  function showError(message) {
    errorBox.textContent = message || '初始化失败，请稍后再试';
    errorBox.classList.add('show');
    errorBox.classList.remove('ok');
  }

  function showSuccess(message) {
    errorBox.textContent = message;
    errorBox.classList.add('show', 'ok');
  }

  function clearError() {
    errorBox.textContent = '';
    errorBox.classList.remove('show', 'ok');
  }

  function syncPathOptions() {
    const value = storageRootInput.value.trim();
    pathOptions.forEach(button => {
      button.classList.toggle('active', button.dataset.root === value);
    });
  }

  function syncPresets() {
    const value = Number(limitInput.value);
    presets.forEach(button => {
      button.classList.toggle('active', Number(button.dataset.quota) === value);
    });
  }

  function setLoading(loading, label) {
    submitting = loading;
    setupBtn.disabled = loading;
    setupBtn.classList.toggle('loading', loading);
    setupLabel.textContent = loading ? (label || '正在创建…') : '完成初始化';
    [usernameInput, passwordInput, confirmInput, limitInput, storageRootInput].forEach(input => {
      input.disabled = loading;
    });
    presets.forEach(button => { button.disabled = loading; });
    pathOptions.forEach(button => { button.disabled = loading; });
  }

  async function applyStorageRoot(root) {
    const response = await fetch(API + '/storage/root', {
      method: 'POST',
      cache: 'no-store',
      credentials: 'same-origin',
      headers: {
        'Content-Type': 'application/json',
        'X-Requested-With': 'SukiSUThemeAdmin',
      },
      body: JSON.stringify({ root, migrate: true }),
    });
    const data = await response.json().catch(() => ({}));
    if (!response.ok || data.ok === false) {
      throw new Error(data.error || ('存储目录配置失败（HTTP ' + response.status + '）'));
    }
    if (data.running === false && data.error) throw new Error(data.error);
    if (!data.running) return data.message || '存储目录已就绪';
    for (let attempt = 0; attempt < 40; attempt++) {
      await new Promise(resolve => setTimeout(resolve, 300));
      let job = {};
      try {
        const jobResponse = await fetch(API + '/storage/job', {
          cache: 'no-store',
          credentials: 'same-origin',
          headers: { 'X-Requested-With': 'SukiSUThemeAdmin' },
        });
        if (jobResponse.status === 401) return '服务正在重启，存储目录已保存';
        job = await jobResponse.json().catch(() => ({}));
      } catch (_) {
        return '服务正在重启，存储目录已保存';
      }
      if (job.error) throw new Error(job.error);
      if (!job.running) return job.message || '存储目录已更新';
    }
    return '存储目录正在迁移，稍后刷新控制台即可看到最新状态';
  }

  async function checkSession() {
    try {
      const response = await fetch(API + '/session', {
        cache: 'no-store',
        credentials: 'same-origin',
        headers: { 'X-Requested-With': 'SukiSUThemeAdmin' },
      });
      if (!response.ok) return {};
      return await response.json();
    } catch (_) {
      return {};
    }
  }

  form.addEventListener('submit', async event => {
    event.preventDefault();
    if (submitting) return;
    if (setupComplete) {
      location.replace(basePath);
      return;
    }
    clearError();
    const username = usernameInput.value.trim();
    const password = passwordInput.value;
    const confirmPassword = confirmInput.value;
    const limitMb = Number(limitInput.value);
    const storageRoot = storageRootInput.value.trim();
    if (!/^[A-Za-z0-9._-]{3,32}$/.test(username)) {
      showError('用户名需要 3-32 位字母、数字或 . _ -');
      usernameInput.focus();
      return;
    }
    if (password.length < 8) {
      showError('密码至少需要 8 位');
      passwordInput.focus();
      return;
    }
    if (password !== confirmPassword) {
      showError('两次输入的密码不一致');
      confirmInput.focus();
      return;
    }
    if (!Number.isInteger(limitMb) || limitMb < 64 || limitMb > 10485760) {
      showError('存储配额需要在 64 MB 到 10 TB 之间');
      limitInput.focus();
      return;
    }
    if (!storageRoot || (!storageRoot.startsWith('/') && !/^[A-Za-z]:[\\/]/.test(storageRoot)) || /\s/.test(storageRoot)) {
      showError('请输入有效的绝对存储路径，例如 /srv/sukisu-themes');
      storageRootInput.focus();
      return;
    }
    setLoading(true);
    try {
      const response = await fetch(API + '/setup', {
        method: 'POST',
        cache: 'no-store',
        credentials: 'same-origin',
        headers: {
          'Content-Type': 'application/json',
          'X-Requested-With': 'SukiSUThemeAdmin',
        },
        body: JSON.stringify({ username, password, limitMb }),
      });
      const data = await response.json().catch(() => ({}));
      if (response.ok && data.ok) {
        adminCreated = true;
        clearError();
        setLoading(true, '配置存储目录…');
        let storageMessage = '';
        try {
          storageMessage = await applyStorageRoot(storageRoot);
        } catch (error) {
          setupComplete = true;
          showError('管理员账号已创建，但存储目录未应用：' + error.message + '。请进入控制台后在「存储」页面修改。');
          setLoading(false);
          setupLabel.textContent = '进入控制台';
          return;
        }
        setupComplete = true;
        showSuccess('初始化完成。' + storageMessage);
        setLoading(false);
        setupLabel.textContent = '进入控制台';
        setTimeout(() => location.replace(basePath), 3200);
        return;
      }
      if (response.status === 409) {
        location.replace(LOGIN_URL);
        return;
      }
      showError(data.error || ('初始化失败（HTTP ' + response.status + '）'));
      passwordInput.select();
    } catch (error) {
      if (adminCreated) {
        setupComplete = true;
        showError('管理员账号已创建，但存储目录未应用：' + error.message + '。请进入控制台后在「存储」页面修改。');
        setLoading(false);
        setupLabel.textContent = '进入控制台';
      } else {
        showError('网络错误，请检查连接后重试');
      }
    } finally {
      if (!setupComplete) setLoading(false);
    }
  });

  document.getElementById('togglePassword').addEventListener('click', () => {
    passwordVisible = !passwordVisible;
    passwordInput.type = passwordVisible ? 'text' : 'password';
  });

  presets.forEach(button => {
    button.addEventListener('click', () => {
      limitInput.value = button.dataset.quota;
      syncPresets();
    });
  });
  limitInput.addEventListener('input', syncPresets);
  syncPresets();

  pathOptions.forEach(button => {
    button.addEventListener('click', () => {
      storageRootInput.value = button.dataset.root;
      syncPathOptions();
      storageRootInput.focus();
    });
  });
  storageRootInput.addEventListener('input', syncPathOptions);
  syncPathOptions();

  document.getElementById('themeToggle').addEventListener('click', () => {
    const next = document.documentElement.dataset.theme === 'light' ? 'dark' : 'light';
    document.documentElement.dataset.theme = next;
    try { localStorage.setItem('sukisu-admin-theme', next); } catch (_) {}
  });

  checkSession().then(data => {
    if (data && data.authenticated) {
      location.replace(basePath);
    } else if (data && data.setupRequired === false) {
      location.replace(LOGIN_URL);
    } else {
      passwordInput.focus();
    }
  });
})();
</script>
</body>
</html>
