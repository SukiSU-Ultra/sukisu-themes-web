<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>登录 · SukiSU 主题镜像控制台</title>
<script>
(function () {
  try {
    var saved = localStorage.getItem('sukisu-admin-theme');
    var light = saved ? saved === 'light' : window.matchMedia('(prefers-color-scheme: light)').matches;
    document.documentElement.dataset.theme = light ? 'light' : 'dark';
  } catch (_) {
    document.documentElement.dataset.theme = 'dark';
  }
})();
</script>
<script src="/i18n.js"></script>
<link rel="stylesheet" href="/app.css">
</head>
<body>
<div class="login-page">
  <button class="theme-toggle" id="themeToggle" title="切换深色/浅色" aria-label="切换深色/浅色">
    <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M20.5 14.2A8.5 8.5 0 0 1 9.8 3.5 8.5 8.5 0 1 0 20.5 14.2Z"/></svg>
    <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2.2M12 19.8V22M2 12h2.2M19.8 12H22M4.9 4.9l1.6 1.6M17.5 17.5l1.6 1.6M19.1 4.9l-1.6 1.6M6.5 17.5l-1.6 1.6"/></svg>
  </button>
  <div class="lang-switch lang-switch-fixed" data-lang-switcher></div>

  <section class="login-card">
    <div class="story">
      <div class="brand">
        <div class="logo"><img src="logo.svg" alt="SukiSU Ultra"></div>
        <div><h1>SukiSU 主题镜像</h1><p>Theme mirror console</p></div>
      </div>
      <h2>管理你的<br><em>主题镜像站</em></h2>
      <p>审核投稿、维护作者许可、配置存储后端，并管理管理器和镜像站之间的访问令牌。</p>
      <div class="features">
        <div class="feature">
          <i><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M5 5h14v14H5z"/><path d="M8 9h8M8 13h5"/></svg></i>
          <div><b>投稿审核</b><span>预览图、作者头像与校验状态一目了然</span></div>
        </div>
        <div class="feature">
          <i><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="3.5" y="5" width="17" height="14" rx="3"/><circle cx="8.5" cy="10" r="2"/><path d="M5.8 16c.4-2 1.3-3 2.7-3s2.3 1 2.7 3"/><path d="M14 9h4M14 12h4"/></svg></i>
          <div><b>作者许可</b><span>可信作者自动发布，其余进入人工审核</span></div>
        </div>
        <div class="feature">
          <i><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><ellipse cx="12" cy="5.5" rx="7.5" ry="3"/><path d="M4.5 5.5v6c0 1.7 3.4 3 7.5 3s7.5-1.3 7.5-3v-6"/><path d="M4.5 11.5v6c0 1.7 3.4 3 7.5 3s7.5-1.3 7.5-3v-6"/></svg></i>
          <div><b>本地 / S3 存储</b><span>随时迁移资源，不中断主题下载</span></div>
        </div>
      </div>
    </div>

    <div class="form-panel">
      <div class="form-brand"><img src="logo.svg" alt="SukiSU"><div><b>SukiSU 主题镜像</b><span>管理后台</span></div></div>
      <h3>登录控制台</h3>
      <p class="lead">使用管理员账号登录，管理主题镜像站。</p>
      <div class="login-error" id="loginError" role="alert"></div>
      <form id="loginForm" autocomplete="on">
        <label for="username">用户名</label>
        <div class="field">
          <input id="username" name="username" autocomplete="username" spellcheck="false" placeholder="管理员用户名" required>
        </div>
        <label for="password">密码</label>
        <div class="field">
          <input id="password" name="password" type="password" autocomplete="current-password" placeholder="输入管理员密码" required>
          <button type="button" class="eye" id="togglePassword" title="显示/隐藏密码" aria-label="显示或隐藏密码">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M2.5 12S6 6.5 12 6.5 21.5 12 21.5 12 18 17.5 12 17.5 2.5 12 2.5 12Z"/><circle cx="12" cy="12" r="2.7"/></svg>
          </button>
        </div>
        <button type="submit" class="login-btn" id="loginBtn"><span class="spinner"></span><span id="loginLabel">登录</span></button>
      </form>
      <div class="form-foot"><a href="/account/">前往用户中心</a></div>
    </div>
  </section>
</div>

<script>
(function () {
  const basePath = location.pathname.replace(/\/login(?:\.html)?\/?$/, '/');
  const API = basePath + 'api';
  const form = document.getElementById('loginForm');
  const errorBox = document.getElementById('loginError');
  const loginBtn = document.getElementById('loginBtn');
  const loginLabel = document.getElementById('loginLabel');
  const passwordInput = document.getElementById('password');
  const usernameInput = document.getElementById('username');
  let passwordVisible = false;
  let submitting = false;

  function showError(message) {
    errorBox.textContent = message || '登录失败，请稍后再试';
    errorBox.classList.add('show');
  }

  function clearError() {
    errorBox.textContent = '';
    errorBox.classList.remove('show');
  }

  function setLoading(loading) {
    submitting = loading;
    loginBtn.disabled = loading;
    loginBtn.classList.toggle('loading', loading);
    loginLabel.textContent = loading ? '正在登录…' : '登录';
    usernameInput.disabled = loading;
    passwordInput.disabled = loading;
  }

  async function checkSession() {
    try {
      const response = await fetch(API + '/session', {
        cache: 'no-store',
        credentials: 'same-origin',
        headers: { 'X-Requested-With': 'SukiSUThemeAdmin' },
      });
      if (!response.ok) return {};
      return await response.json();
    } catch (_) {
      return {};
    }
  }

  form.addEventListener('submit', async event => {
    event.preventDefault();
    if (submitting) return;
    clearError();
    const username = usernameInput.value.trim();
    const password = passwordInput.value;
    if (!username || !password) {
      showError('请输入用户名和密码');
      return;
    }
    setLoading(true);
    try {
      const response = await fetch(API + '/login', {
        method: 'POST',
        cache: 'no-store',
        credentials: 'same-origin',
        headers: {
          'Content-Type': 'application/json',
          'X-Requested-With': 'SukiSUThemeAdmin',
        },
        body: JSON.stringify({ username, password }),
      });
      const data = await response.json().catch(() => ({}));
      if (response.ok && data.ok) {
        location.replace(basePath);
        return;
      }
      if (response.status === 429) {
        showError(data.error || '尝试次数过多，请 5 分钟后再试');
      } else if (response.status === 401) {
        showError(data.error || '用户名或密码错误');
      } else {
        showError(data.error || ('登录失败（HTTP ' + response.status + '）'));
      }
      passwordInput.select();
    } catch (error) {
      showError('网络错误，请检查连接后重试');
    } finally {
      setLoading(false);
    }
  });

  document.getElementById('togglePassword').addEventListener('click', () => {
    passwordVisible = !passwordVisible;
    passwordInput.type = passwordVisible ? 'text' : 'password';
  });

  document.getElementById('themeToggle').addEventListener('click', () => {
    const next = document.documentElement.dataset.theme === 'light' ? 'dark' : 'light';
    document.documentElement.dataset.theme = next;
    try { localStorage.setItem('sukisu-admin-theme', next); } catch (_) {}
  });

  checkSession().then(data => {
    if (data && data.authenticated) {
      location.replace(basePath);
    } else if (data && data.setupRequired) {
      location.replace(basePath + 'setup');
    } else {
      if (data && data.adminUsername) {
        usernameInput.value = data.adminUsername;
      }
      passwordInput.focus();
    }
  });
})();
</script>
</body>
</html>
