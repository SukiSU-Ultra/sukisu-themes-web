[package]
name = "sukisu-theme-web"
version = "1.0.0"
edition = "2021"
rust-version = "1.85"
description = "SukiSU theme mirror admin service (Rust rewrite of the Python backend)"
license = "MIT"

[dependencies]
axum = { version = "0.8", features = ["multipart"] }
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["fs", "trace", "compression-gzip", "compression-zstd"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
sha2 = "0.10"
hex = "0.4"
aes-gcm = "0.10"
zip = { version = "2", default-features = false, features = ["deflate"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif"] }
kamadak-exif = "0.6"
rand = "0.8"
regex = "1"
walkdir = "2"
mime_guess = "2"
percent-encoding = "2"
tokio-util = { version = "0.7", features = ["io"] }
bytes = "1"
futures = "0.3"
fs4 = "0.13"
subtle = "2"
bcrypt = "0.15"
rusqlite = { version = "0.32", features = ["bundled"] }
tokio-rusqlite = "0.6"
lettre = { version = "0.11", default-features = false, features = ["builder", "smtp-transport", "tokio1", "tokio1-rustls-tls"] }
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
aws-sdk-s3 = { version = "1", default-features = false, features = ["behavior-version-latest", "rustls", "rt-tokio"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
tempfile = "3"
http-body-util = "0.1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

[workspace]
